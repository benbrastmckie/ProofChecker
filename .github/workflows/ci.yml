name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build, test, and lint with Lean
        id: lean-action
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          # The Batteries env_linter set (simpNF, docBlame, defsWithUnderscore,
          # structureInType, tacticDocs, unusedArguments) cannot be narrowed via lint-args --
          # runLinter's own CLI always runs every registered linter unconditionally, with no
          # selection flag. scripts/nolints.json grandfathers the 307 pre-existing findings
          # (the standard Batteries/Mathlib mechanism: generated via
          # `lake exe runLinter --update`, read on every run), so `lake lint` now fails only on
          # a genuinely NEW finding. dupNamespace (a separate Lean core text linter, 14
          # pre-existing warnings in ChronicleTypes.lean) never reaches the driver's report or
          # its exit code either way.
          lint: true
          use-mathlib-cache: true

      - name: Report results
        if: always()
        run: |
          echo "Build status: ${{ steps.lean-action.outputs.build-status }}"
          echo "Test status: ${{ steps.lean-action.outputs.test-status }}"
          echo "Lint status: ${{ steps.lean-action.outputs.lint-status }}"
